apiVersion: v1
kind: ResourceQuota
metadata:
  name: webapp-quota
  namespace: webapp
spec:
  hard:
    requests.cpu: "750m"
    requests.memory: 768Mi
    limits.cpu: "1500m"
    limits.memory: 1536Mi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: webapp-limits
  namespace: webapp
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: 300m
        memory: 256Mi
      min:
        cpu: 10m
        memory: 32Mi
