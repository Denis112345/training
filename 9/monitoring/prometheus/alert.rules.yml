groups:
  - name: webapp
    rules:
      - alert: WebappDown
        expr: up{job="webapp"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Webapp is down"
          description: "Prometheus has not been able to scrape webapp:8000/metrics for 30s."

      - alert: WebappHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="webapp",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{job="webapp"}[5m])) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Webapp 5xx error rate above 10%"
          description: "More than 10% of requests to webapp returned a 5xx status in the last 5 minutes."
